name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # usocket (dbus-next) has a node-gyp install script that is unnecessary:
      # dbus-next falls back to net sockets and we verified it still works.
      - run: npm ci --ignore-scripts
      - run: npm test
